services:
  market-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: market-bot:${MARKET_BOT_IMAGE_TAG:-0.0.1-SNAPSHOT}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MARKET_BOT_PORT:-8080}:8080"
    volumes:
      - ${MARKET_BOT_WATCHLIST_HOST_FILE:-./config/watchlist.yaml}:/app/config/watchlist.yaml:ro
      - ${MARKET_BOT_LOG_DIR:-./logs}:/app/logs
    environment:
      APP_DATASOURCE_URL: ${APP_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5455/test_db}
      APP_DATASOURCE_USERNAME: ${APP_DATASOURCE_USERNAME:-test}
      APP_DATASOURCE_PASSWORD: ${APP_DATASOURCE_PASSWORD:-test}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TWELVE_API_KEY: ${TWELVE_API_KEY:-}
      MARKET_BOT_WATCHLIST_FILE: ${MARKET_BOT_WATCHLIST_FILE:-/app/config/watchlist.yaml}
      MARKET_BOT_TRADING_ENABLED: ${MARKET_BOT_TRADING_ENABLED:-false}
      MARKET_BOT_TRADING_MODE: ${MARKET_BOT_TRADING_MODE:-PAPER}
      MARKET_BOT_TRADING_LIVE_ENABLED: ${MARKET_BOT_TRADING_LIVE_ENABLED:-false}
      MARKET_BOT_TRADING_REQUIRE_MANUAL_CONFIRMATION: ${MARKET_BOT_TRADING_REQUIRE_MANUAL_CONFIRMATION:-true}
      MARKET_BOT_TRADING_MAX_ORDER_VALUE_EUR: ${MARKET_BOT_TRADING_MAX_ORDER_VALUE_EUR:-500}
      MARKET_BOT_TRADING_IBKR_ENABLED: ${MARKET_BOT_TRADING_IBKR_ENABLED:-false}
      MARKET_BOT_TRADING_IBKR_HOST: ${MARKET_BOT_TRADING_IBKR_HOST:-host.docker.internal}
      MARKET_BOT_TRADING_IBKR_PORT: ${MARKET_BOT_TRADING_IBKR_PORT:-7497}
      MARKET_BOT_TRADING_IBKR_CLIENT_ID: ${MARKET_BOT_TRADING_IBKR_CLIENT_ID:-1}
      MARKET_BOT_TRADING_IBKR_ACCOUNT_ID: ${MARKET_BOT_TRADING_IBKR_ACCOUNT_ID:-}
      MARKET_BOT_TRADING_IBKR_PAPER_ACCOUNT_ONLY: ${MARKET_BOT_TRADING_IBKR_PAPER_ACCOUNT_ONLY:-true}
      MARKET_BOT_TRADING_IBKR_CONNECT_ON_STARTUP: ${MARKET_BOT_TRADING_IBKR_CONNECT_ON_STARTUP:-false}
      MARKET_BOT_LOG_FILE: ${MARKET_BOT_LOG_FILE:-/app/logs/market-bot.log}
      MARKET_BOT_LOG_MAX_FILE_SIZE: ${MARKET_BOT_LOG_MAX_FILE_SIZE:-10MB}
      MARKET_BOT_LOG_MAX_HISTORY: ${MARKET_BOT_LOG_MAX_HISTORY:-14}
      MARKET_BOT_LOG_TOTAL_SIZE_CAP: ${MARKET_BOT_LOG_TOTAL_SIZE_CAP:-200MB}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
