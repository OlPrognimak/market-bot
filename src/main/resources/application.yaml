app:
  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5455/test_db}
    username: ${APP_DATASOURCE_USERNAME:test}
    password: ${APP_DATASOURCE_PASSWORD:test}
    configuration:
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET:change-this-secret-before-production}
    jwt-expiration-minutes: ${APP_SECURITY_JWT_EXPIRATION_MINUTES:480}
    admin:
      username: ${APP_SECURITY_ADMIN_USERNAME:admin}
      password: ${APP_SECURITY_ADMIN_PASSWORD:admin123}
      email: ${APP_SECURITY_ADMIN_EMAIL:admin@market-bot.local}
      display-name: ${APP_SECURITY_ADMIN_DISPLAY_NAME:Administrator}


spring:
  application:
    name: market-bot
  main:
    web-application-type: servlet
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: marketbot
        hbm2ddl:
          create_namespaces: true
        connection:
          pool_size: 30
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:no-key-configured}
      chat:
        model: ${OPENAI_NEWS_MODEL:gpt-5-mini}

logging:
#  file:
#    name: ${MARKET_BOT_LOG_FILE:logs/market-bot.log}
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level) %clr(%logger{0}){cyan} - %msg%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{0} - %msg%n%wEx"
#  logback:
#    rollingpolicy:
#      file-name-pattern: ${MARKET_BOT_LOG_FILE_PATTERN:logs/market-bot.%d{yyyy-MM-dd}.%i.log.gz}
#      max-file-size: ${MARKET_BOT_LOG_MAX_FILE_SIZE:10MB}
#      max-history: ${MARKET_BOT_LOG_MAX_HISTORY:14}
#      total-size-cap: ${MARKET_BOT_LOG_TOTAL_SIZE_CAP:200MB}
#      clean-history-on-start: ${MARKET_BOT_LOG_CLEAN_HISTORY_ON_START:false}
  level:
    com.prognimak.marketbot: ${MARKET_BOT_LOG_LEVEL:INFO}

market-bot:
  providers:
    finnhub-api-key: ${FINNHUB_API_KEY:no-key-configured}
    twelve-data-api-key: ${TWELVE_API_KEY:xxxx}

  message-sender:
    telegram-bot-token: ${TELEGRAM_BOT_TOKEN:xxx}
    telegram-chat-id: ${TELEGRAM_CHAT_ID:11111111}
    max-concurrent-sends: ${MARKET_BOT_NOTIFICATION_MAX_CONCURRENT_SENDS:20}

  scanner:
    # Delay between market scans in milliseconds.
    # Example: 30000 means the app checks the watchlist every 30 seconds.
    poll-interval-ms: 30000

    # Minimum quote difference required to treat a provider quote as changed.
    quote-change-epsilon: ${MARKET_BOT_QUOTE_CHANGE_EPSILON:0.01}

    # Minimum rounded delta that should be persisted even when the quote is otherwise unchanged.
    max-changes-for-persist: ${MARKET_BOT_MAX_CHANGES_FOR_PERSIST:0.1}

    # Number of attempts for transient quote provider failures such as HTTP 429 or 5xx.
    max-quote-fetch-attempts: ${MARKET_BOT_MAX_QUOTE_FETCH_ATTEMPTS:3}

    # Delay between transient quote provider retries, in milliseconds.
    quote-fetch-retry-delay-ms: ${MARKET_BOT_QUOTE_FETCH_RETRY_DELAY_MS:1000}

  shares:
    watchlist-file: ${MARKET_BOT_WATCHLIST_FILE:classpath:/watchlist.yaml}

    # Fallback watchlist. If market-bot.shares.watchlist-file points to a readable file,
    # that external file is used instead and is reloaded on every scan.
    watchlist:
      AAPL: Apple
      NVDA: NVIDIA

  alert:
    # Send a DOWN alert only when the current daily change is less than or equal to this value.
    # Example: -0.4 means the share must be down at least 0.4% for the day.
    drop-alert-percent: -0.2

    # Send an UP alert only when the current daily change is greater than or equal to this value.
    # Example: 0.4 means the share must be up at least 0.4% for the day.
    rise-alert-percent: 0.2

    # Minimum accumulated movement required before an alert can be sent.
    # Example: 0.8 means the rolling price movement must be at least 0.8% up or down.
    maximal-rolling-price: 0.5

    maximal-rolling-size: 15

  crypto:
    scanner-enabled: ${MARKET_BOT_CRYPTO_SCANNER_ENABLED:true}
    poll-interval-ms: ${MARKET_BOT_CRYPTO_POLL_INTERVAL_MS:60000}
    watchlist-file: ${MARKET_BOT_CRYPTO_WATCHLIST_FILE:classpath:/crypto-watchlist.yaml}

    # Fallback crypto watchlist. The external watchlist-file is used when readable.
    watchlist:
      BTC: Bitcoin
      ETH: Ethereum

    min-quote-volume: ${MARKET_BOT_CRYPTO_MIN_QUOTE_VOLUME:1000000}
    price-change-percent: ${MARKET_BOT_CRYPTO_PRICE_CHANGE_PERCENT:3}
    scan-window: ${MARKET_BOT_CRYPTO_SCAN_WINDOW:5m}
    max-quote-fetch-attempts: ${MARKET_BOT_CRYPTO_MAX_QUOTE_FETCH_ATTEMPTS:3}
    quote-fetch-retry-delay-ms: ${MARKET_BOT_CRYPTO_QUOTE_FETCH_RETRY_DELAY_MS:1000}

  extended-hours:
    enabled: ${MARKET_BOT_EXTENDED_HOURS_ENABLED:true}
    poll-interval-ms: ${MARKET_BOT_EXTENDED_HOURS_POLL_INTERVAL_MS:60000}
    stale-after-seconds: ${MARKET_BOT_EXTENDED_HOURS_STALE_AFTER_SECONDS:180}
    rolling-size: ${MARKET_BOT_EXTENDED_HOURS_ROLLING_SIZE:15}

  futures:
    enabled: ${MARKET_BOT_FUTURES_ENABLED:true}
    poll-interval-ms: ${MARKET_BOT_FUTURES_POLL_INTERVAL_MS:60000}
    stale-after-seconds: ${MARKET_BOT_FUTURES_STALE_AFTER_SECONDS:180}
    rolling-size: ${MARKET_BOT_FUTURES_ROLLING_SIZE:15}

  news-monitoring:
    enabled: ${MARKET_BOT_NEWS_MONITORING_ENABLED:true}
    lookback-hours: ${MARKET_BOT_NEWS_LOOKBACK_HOURS:168}
    max-articles-per-instrument: ${MARKET_BOT_NEWS_MAX_ARTICLES_PER_INSTRUMENT:10}
    minimum-confidence: ${MARKET_BOT_NEWS_MINIMUM_CONFIDENCE:65}
    minimum-impact-score: ${MARKET_BOT_NEWS_MINIMUM_IMPACT_SCORE:70}
    maximum-analysis-age-hours: ${MARKET_BOT_NEWS_MAXIMUM_ANALYSIS_AGE_HOURS:72}
    send-alerts: ${MARKET_BOT_NEWS_SEND_ALERTS:false}
    background-monitoring-enabled: ${MARKET_BOT_NEWS_BACKGROUND_MONITORING_ENABLED:false}
    background-poll-interval-ms: ${MARKET_BOT_NEWS_BACKGROUND_POLL_INTERVAL_MS:900000}
    web-research-model: ${OPENAI_WEB_RESEARCH_MODEL:gpt-5-mini}
    providers:
      yahoo-enabled: ${MARKET_BOT_NEWS_YAHOO_ENABLED:true}
      finnhub-enabled: ${MARKET_BOT_NEWS_FINNHUB_ENABLED:true}

  dashboard:
    enabled: true
    websocket-enabled: true
    scan-trigger-mode: BOTH
    max-results: 100
