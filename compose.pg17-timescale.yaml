services:
  postgres17-timescale:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-3477}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-test_db}
      POSTGRES_USER: ${APP_DATASOURCE_USERNAME:-test}
      POSTGRES_PASSWORD: ${APP_DATASOURCE_PASSWORD:-test}
    volumes:
      - market_bot_pg17_timescale_data:/var/lib/postgresql/data
      - ./work/dumps:/work/dumps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  market_bot_pg17_timescale_data:
